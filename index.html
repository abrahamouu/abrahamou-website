<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#abbab9" />
    <script>
      // Start the homepage portrait before React loads, only on its own route.
      if (window.location.pathname === "/") {
        const portraitPreload = document.createElement("link");
        portraitPreload.rel = "preload";
        portraitPreload.as = "image";
        portraitPreload.type = "image/webp";
        portraitPreload.href = "/profile/abraham-ou-portrait-1600.webp";
        portraitPreload.setAttribute(
          "imagesrcset",
          "/profile/abraham-ou-portrait-800.webp 1x, /profile/abraham-ou-portrait-1600.webp 2x",
        );
        portraitPreload.setAttribute("fetchpriority", "high");
        document.head.appendChild(portraitPreload);
      }
    </script>
    <meta
      name="description"
      content="Abraham Ou is an Embedded Software Engineer at TP-Link Systems. Explore his work in embedded software, networking, and computer architecture."
    />
    <link
      rel="preload"
      href="/fonts/dm-sans-medium.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <title>Abraham Ou — Embedded Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
